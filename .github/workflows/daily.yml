name: Daily AI News Update

on:
  schedule:
    # 每天 UTC 0:00 运行（北京时间 08:00）
    - cron: "0 0 * * *"
  workflow_dispatch: {}   # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build news.json
        run: python build.py

      - name: Commit & push if changed
        run: |
          git config user.name "ai-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/news.json data/archive/ data/translate_cache.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily news update $(date -u +%Y-%m-%d)"
            git push
          fi
